name: Publish @upspeech/i18n

# DORMANT: both clients consume the package as a git dependency pinned to a tag,
# so nothing reads the registry. Manual only, so cutting a release tag never
# publishes. Bump package.json "version" to the release before running it.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"
          scope: "@upspeech"
      - name: Check parity
        run: npm run check
      - name: Publish if version changed
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@upspeech/i18n@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already published, skipping."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
